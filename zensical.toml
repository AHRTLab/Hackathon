[project]
site_name = "Myo Lever Controller"
site_description = "Drive a simulated Clearpath Jackal with one forearm: arm angle steers, a firm fist brakes. Best Presentation, AWARE-AI Fall 2026 Hackathon."
site_author = "AJ Barea"
site_url = "https://ajbarea.github.io/Hackathon/"
repo_url = "https://github.com/ajbarea/Hackathon"
repo_name = "ajbarea/Hackathon"
copyright = "AJ Barea"

nav = [
  { "Home" = "index.md" },
  { "Drive it" = "drive.md" },
  { "How it works" = "how-it-works.md" },
  { "Results" = "results.md" },
  { "Data" = "data.md" },
  { "Deck" = "deck/" },
  { "Live sim" = "sim/" },
  { "Event kit" = [
      { "Design brief" = "BRIEF.md" },
      { "Runbook" = "RUNBOOK.md" },
      { "Spike findings" = "SPIKE_FINDINGS.md" },
  ]},
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/reveal.js"]

[project.theme]
name = "material"
language = "en"
custom_dir = "overrides"

features = [
    "content.code.copy",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
logo = "material/robot-industrial"

[project.extra]
generator = false
og_image = "assets/sim-l2-slalom.png"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ajbarea/Hackathon"
name = "Myo Lever Controller on GitHub"

# Zensical's default extensions, written out because this table replaces them. One change:
# anchor_linenums off, since no block shows line numbers and each empty anchor is a keyboard stop.
# Copied from Zensical 0.0.73: on an upgrade, diff it against the new defaults.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = false
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
